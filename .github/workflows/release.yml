name: Release

# Every pushed tag (v1.0.0, 1.0.0, ...) publishes a GitHub release that contains
# the built jar(s) from build/libs/. Source archives (zip / tar.gz) are attached by
# GitHub itself for every release, so they are not re-uploaded here.
on:
  push:
    tags:
      - "**"
  # Manual re-run for a tag that already exists (e.g. after a failed build).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REF: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The tag is the source of truth for the version: v1.2.0 -> 1.2.0.
      # Tags that are not version-like fall back to mod_version from gradle.properties.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "$REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            VERSION="${REF#v}"
          else
            VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $REF as version $VERSION"

      - name: Build
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace -Pmod_version="$MOD_VERSION"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.REF }}
          name: ${{ env.REF }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/libs/*.jar
