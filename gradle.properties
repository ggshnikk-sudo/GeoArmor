org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft. 26.1+ ships unobfuscated: Loom neither remaps Minecraft nor remaps our jar,
# and Yarn no longer exists. Only Mojang (vanilla) names are usable here.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.18.2

mod_version=1.0.0
maven_group=dev.geoarmor
archives_base_name=geoarmor

java_version=25

# Hard dependency (Modrinth maven). The id (not the number) is used so the coordinate can never be
# re-pointed at a different loader's build; 7gaQHok7 == geckolib-fabric-26.2-5.5.5.jar.
geckolib_version=7gaQHok7
fabric_api_version=0.161.0+26.2

fabric.loom.disableObfuscation=true
